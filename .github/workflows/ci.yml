name: SpecRAG CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install matplotlib

    - name: Start PostgreSQL Service (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo systemctl start postgresql
        sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
        sudo -u postgres createdb -O postgres postgres 2>/dev/null || true

    - name: Execute Full Automated Test Suite (319 Tests)
      run: |
        python run_tests.py --tier full

    - name: Run Interactive Live Showcase Demo
      run: |
        python demo.py

    - name: Verify Ablation Benchmark Script
      run: |
        python benchmarks/benchmark_ablation.py --cycles 2

